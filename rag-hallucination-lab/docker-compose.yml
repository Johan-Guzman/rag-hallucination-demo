services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    # Configuration (provider selection + API key) is read from backend/.env, the
    # same file used for local runs. This is the single source of truth: to run
    # with Gemini, set LLM_PROVIDER=gemini and GEMINI_API_KEY there. The file is
    # excluded from the image by .dockerignore, so the key is never baked in.
    # `required: false` keeps the stack working in mock mode when it is absent.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Knowledge base lives in the mounted ./data volume (documents + demo_cases.json)
      - DATA_DIR=/app/data
      # Reserved for a future real vector store; the current mock is in-memory.
      - CHROMA_PERSIST_DIR=/app/data/chroma
    healthcheck:
      # python:3.11-slim has no curl, so use the interpreter that is guaranteed present.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Use the development stage so the mounted source is served by `next dev`
      # with hot reload. The default (last) stage is the production image Render
      # builds and runs with `next start`.
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Same-origin proxy target consumed by next.config.js on the Next.js server.
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
